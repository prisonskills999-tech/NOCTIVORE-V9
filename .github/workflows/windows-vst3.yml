name: Build VOIDCORE Pure Source Xeno VST3

on:
  # Manual runs prevent repeated private-repository minute consumption on every commit.
  push:
    branches: [feature/voidcore-astral-full-reskin, feature/voidcore-hifi-clean-diverse, feature/voidcore-phase-clean-source-audio]
  workflow_dispatch:

permissions:
  contents: read

# Multiple pushes must not waste private-repository Actions minutes.
concurrency:
  group: voidcore-xeno-vst3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-vst3:
    name: VST3 ${{ matrix.edition }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: FULL_GUI
            generic: 'OFF'
          - edition: SAFE_GUI
            generic: 'ON'
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Verify VOIDCORE controls, automation and Astral skin
        shell: pwsh
        run: |
          python tests/verify_voidcore_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Legacy UI preflight failed' }
          python tests/verify_astral_skin.py
          if ($LASTEXITCODE -ne 0) { throw 'Astral GUI preflight failed' }
          python tests/verify_audio_purity.py
          if ($LASTEXITCODE -ne 0) { throw 'Audio purity preflight failed' }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install bank generator dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Generate 200 distinctive alien soundscape WAVs
        shell: pwsh
        run: |
          python Source/generate_xeno_soundscapes.py
          if ($LASTEXITCODE -ne 0) { throw 'Sound-bank generation failed' }
          $n = @(Get-ChildItem -Path Banks -File -Filter '*.wav').Count
          if ($n -ne 200) { throw "Expected 200 WAVs; found $n" }
          python tests/verify_xeno_diversity.py
          if ($LASTEXITCODE -ne 0) { throw 'Sound-bank diversity verification failed' }
          Write-Host "Generated and verified $n xeno sounds"

      - name: Download JUCE 8.0.15 with retries (avoid Git clone EOF)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path C:/nfx-juce -Force | Out-Null
          $archive = 'C:/nfx-juce/juce.zip'
          $folder = 'C:/nfx-juce/JUCE-8.0.15'
          $url = 'https://codeload.github.com/juce-framework/JUCE/zip/refs/tags/8.0.15'
          $ok = $false
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            try {
              Remove-Item $archive -ErrorAction SilentlyContinue
              Remove-Item $folder -Recurse -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest -Uri $url -OutFile $archive -TimeoutSec 180
              Expand-Archive -LiteralPath $archive -DestinationPath 'C:/nfx-juce' -Force
              if (!(Test-Path "$folder/CMakeLists.txt")) { throw 'Incomplete JUCE archive' }
              $ok = $true
              break
            } catch {
              Write-Warning "JUCE archive attempt $attempt failed: $_"
              Start-Sleep -Seconds (3 * $attempt)
            }
          }
          if (!$ok) { throw 'Could not download or unzip JUCE after five attempts' }

      - name: Configure JUCE 8 and Windows x64 VST3
        shell: pwsh
        run: |
          $buildDir = 'C:/voidcore12_${{ matrix.edition }}'
          $generator = 'Visual Studio 17 2022'
          Write-Host "Using CMake generator: $generator"
          cmake -S . -B $buildDir -G $generator -A x64 '-DJUCE_DIR=C:/nfx-juce/JUCE-8.0.15' '-DJUCE_BUILD_EXTRAS=OFF' '-DNOCTIVORE_GENERIC_EDITOR=${{ matrix.generic }}'
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }

      - name: Compile release VST3
        shell: pwsh
        run: |
          cmake --build 'C:/voidcore12_${{ matrix.edition }}' --config Release --target NOCTIVORE_FX_VST3 --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Windows C++ compilation failed' }

      - name: Verify and ZIP the installable plugin
        shell: pwsh
        run: |
          $buildDir = 'C:/voidcore12_${{ matrix.edition }}'
          $bundles = @(Get-ChildItem -Path $buildDir -Recurse -Directory -Filter '*.vst3' | Where-Object {
            Test-Path (Join-Path $_.FullName 'Contents/Resources/Banks/00_36.wav')
          })
          if ($bundles.Count -ne 1) { throw "Expected exactly one bundled VST3, found $($bundles.Count)" }
          $bundle = $bundles[0]
          $banks = @(Get-ChildItem (Join-Path $bundle.FullName 'Contents/Resources/Banks') -File -Filter '*.wav')
          if ($banks.Count -ne 200) { throw "Bundle has $($banks.Count) of 200 WAVs" }
          $bins = @(Get-ChildItem (Join-Path $bundle.FullName 'Contents/x86_64-win') -File -Filter '*.vst3' -ErrorAction SilentlyContinue | Where-Object { $_.Length -gt 100000 })
          if ($bins.Count -ne 1) { throw 'Missing compiled x64 VST3 module' }
          $target = Join-Path $env:GITHUB_WORKSPACE 'VOIDCORE_V12_XENO_${{ matrix.edition }}.zip'
          Compress-Archive -LiteralPath $bundle.FullName -DestinationPath $target -CompressionLevel Fastest -Force
          if (!(Test-Path $target)) { throw 'ZIP was not created' }
          Write-Host "Package: $target"

      - name: Upload downloadable Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: VOIDCORE-PURE-XENO-${{ matrix.edition }}-WIN64-VST3
          path: VOIDCORE_V12_XENO_${{ matrix.edition }}.zip
          if-no-files-found: error
          retention-days: 30
