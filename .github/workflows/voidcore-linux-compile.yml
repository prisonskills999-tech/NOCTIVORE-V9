name: VOIDCORE GUI C++ compile test

on:
  # Run Linux GUI verification on demand; no automatic private-runner charges.
  push:
    branches: [feature/voidcore-astral-full-reskin, feature/voidcore-hifi-clean-diverse, feature/voidcore-phase-clean-source-audio, feature/voidcore-final-one-page-red]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voidcore-linux-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Verify VOIDCORE and Astral GUI attachments
        run: |
          python3 tests/verify_voidcore_ui.py
          python3 tests/verify_astral_skin.py
          python3 tests/verify_audio_purity.py

      - name: Install Linux JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libjack-jackd2-dev libfreetype6-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libgl1-mesa-dev libgtk-3-dev libcurl4-openssl-dev
      - name: Download JUCE 8.0.15 archive
        run: |
          curl --fail --retry 5 --retry-all-errors --location \
            https://codeload.github.com/juce-framework/JUCE/zip/refs/tags/8.0.15 -o /tmp/juce.zip
          unzip -q /tmp/juce.zip -d /tmp/
      - name: Configure and compile actual FULL_GUI editor
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DJUCE_DIR=/tmp/JUCE-8.0.15 -DNOCTIVORE_GENERIC_EDITOR=OFF
          cmake --build build --target NOCTIVORE_FX --parallel 2
